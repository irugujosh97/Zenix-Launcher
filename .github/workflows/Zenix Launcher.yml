
name: Build Zenix Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Extract Zenix source ZIP
        id: locate
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'Zenix_Launcher_V1_Logo_Updated.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Zenix source ZIP not found in repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/zenix-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/zenix-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/zenix-source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build Zenix APK
        run: gradle -p "${{ steps.locate.outputs.project_dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenix-Launcher-V1-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
